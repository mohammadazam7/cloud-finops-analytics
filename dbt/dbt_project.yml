name: finops
version: "0.2.0"
config-version: 2
profile: finops

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Reporting window for dim_date.
  calendar_start: "2024-01-01"
  calendar_end: "2027-01-01"
  # fct_cost_daily reloads this many days before its latest charge date on each run.
  cost_lookback_days: 3

models:
  finops:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

flags:
  send_anonymous_usage_stats: false
